name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: crypto
          POSTGRES_PASSWORD: crypto_secret
          POSTGRES_DB: crypto_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crypto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_SYNC: postgresql+psycopg2://crypto:crypto_secret@localhost:5432/crypto_db
      DATABASE_URL: postgresql+asyncpg://crypto:crypto_secret@localhost:5432/crypto_db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts dags
      - name: Tests
        run: pytest -q --cov=src --cov-report=term
